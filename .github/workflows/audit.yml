name: Audit Tap
on:
  push:
    branches: main
  pull_request:

env:
  HOMEBREW_NO_AUTO_UPDATE: 1

jobs:
  test:
    runs-on: macos-latest
    name: Audit Tap Contents
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Update Homebrew
        run: brew update

      - name: Add Tap
        run: brew tap codello/brewery .

      - name: Run Audit
        run: brew audit --strict --tap codello/brewery
